spring.application.name=backend

# Port
server.port=8080

# SQL Server Datasource Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=agile_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=1234$
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration (Allow up to 50MB per file)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

